<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的專屬工具箱</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #282a36;
            --text-color: #f8f8f2;
            --accent-color: #bd93f9;
            --hover-color: #ff79c6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
        }
        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { color: var(--accent-color); font-size: 2.5rem; margin-bottom: 0.5rem; }
        .search-bar {
            width: 100%; max-width: 400px; padding: 0.8rem 1rem;
            border-radius: 8px; border: 2px solid #44475a;
            background-color: var(--bg-color); color: white; font-size: 1rem; outline: none;
        }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem; max-width: 1100px; margin: 0 auto;
        }
        .card {
            background-color: var(--card-bg); border-radius: 12px; padding: 1.5rem;
            text-decoration: none; color: var(--text-color);
            transition: transform 0.2s, border-color 0.2s;
            border: 2px solid transparent; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--hover-color); }
        .card h2 { margin-top: 0; color: var(--hover-color); }
        .card .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧰 我的專屬工具箱</h1>
        <input type="text" id="searchInput" class="search-bar" placeholder="搜尋工具...">
    </div>
    <div class="grid" id="toolGrid">
        <a href="litematica.html" class="card" data-tags="minecraft litematica">
            <div class="icon">⛏️</div>
            <h2>Litematica 解析器</h2>
            <p>讀取 .litematic 檔案並列出方塊清單。</p>
        </a>
    </div>
    <script>
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.card').forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'flex' : 'none';
            });
        });
    </script>
</body>
</html>

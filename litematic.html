<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litematica 解析器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://unpkg.com/nbt@2.2.0/nbt.js"></script>
    <style>
        body { font-family: sans-serif; background: #1e1e2e; color: #f8f8f2; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #282a36; padding: 30px; border-radius: 15px; }
        .upload-area { border: 2px dashed #6272a4; padding: 40px; cursor: pointer; margin-bottom: 20px; }
        .block-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .block-item { background: #44475a; padding: 10px; border-radius: 5px; font-size: 14px; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #bd93f9; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-btn">← 回到工具箱</a>
        <h1>⛏️ Litematica 解析器</h1>
        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            點擊上傳 .litematic 檔案
            <input type="file" id="fileInput" accept=".litematic" style="display:none">
        </div>
        <div id="status">等待檔案中...</div>
        <div id="results" class="block-list"></div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('status').innerText = "處理中...";
            try {
                const arrayBuffer = await file.arrayBuffer();
                const unzipped = pako.inflate(new Uint8Array(arrayBuffer));
                nbt.parse(unzipped, function(error, data) {
                    if (error) throw error;
                    displayBlocks(data.value);
                });
            } catch (err) {
                document.getElementById('status').innerText = "解析失敗。";
            }
        });

        function displayBlocks(nbtData) {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            const uniqueBlocks = new Set();
            const regions = nbtData.Regions.value;
            for (const name in regions) {
                const palette = regions[name].value.BlockStatePalette.value;
                palette.forEach(b => {
                    const blockName = b.value.Name.value;
                    if (!blockName.includes('air')) uniqueBlocks.add(blockName.replace('minecraft:', ''));
                });
            }
            document.getElementById('status').innerText = "解析完成！";
            Array.from(uniqueBlocks).sort().forEach(name => {
                const div = document.createElement('div');
                div.className = 'block-item';
                div.innerText = name;
                resultsDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>

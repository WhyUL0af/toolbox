<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litematica 材料清單</title>
    <style>
        :root {
            --bg-color: #0e0e11;
            --card-bg: #1a1b1e;
            --row-bg: #232428;
            --row-hover: #2a2b30;
            --text-main: #ffffff;
            --text-muted: #8b8d98;
            --accent-blue: #2563eb;
            --pill-bg: #3b2845;
            --pill-text: #d4a5ff;
            --border-color: #313238;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 1000px; }

        .header-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        .project-info { display: flex; align-items: center; gap: 16px; }

        .project-icon {
            background-color: #1e3a8a;
            color: #60a5fa;
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }
        .project-icon:hover { transform: scale(1.05); background-color: #2563eb; }

        .project-details h1 { margin: 0 0 4px 0; font-size: 22px; font-weight: 600; }
        .project-details p { margin: 0; font-size: 13px; color: var(--text-muted); }

        .search-bar {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            width: 220px;
            font-size: 14px;
            outline: none;
        }

        .list-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
        }

        .list-header {
            display: grid;
            grid-template-columns: 2.5fr 1fr 1.5fr 2fr;
            padding: 0 16px 12px 16px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .row {
            display: grid;
            grid-template-columns: 2.5fr 1fr 1.5fr 2fr;
            background-color: var(--row-bg);
            margin-bottom: 8px;
            border-radius: 12px;
            padding: 14px 16px;
            align-items: center;
            transition: 0.15s;
        }

        .col-item { display: flex; align-items: center; gap: 14px; font-weight: 600; }
        
        .block-icon {
            width: 34px;
            height: 34px;
            image-rendering: pixelated; 
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .col-total { font-size: 16px; font-weight: 700; }
        .col-stacks, .col-shulkers { font-size: 14px; }
        
        .dim { color: var(--text-muted); font-size: 12px; }
        .highlight { font-weight: 600; color: var(--text-main); }
        .box-pill {
            background-color: var(--pill-bg);
            color: var(--pill-text);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }
/* 調整 Grid 比例，為眼睛留位置 */
.list-header, .row {
    display: grid;
    grid-template-columns: 50px 2.5fr 1fr 1.5fr 2fr; /* 固定第一欄寬度 */
    align-items: center;
}
/* 眼睛按鈕樣式 */
.eye-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--text-muted);
    transition: 0.2s;
}

.eye-btn:hover {
    color: var(--accent-blue);
    transform: scale(1.1);
}

/* --- 核心修改：劃掉的視覺效果 --- */
.row.completed {
    background-color: #121214; /* 變暗：使用比背景稍淺一點的顏色 */
    opacity: 0.25;             /* 變透：讓整行變得很淡 */
    filter: grayscale(1);      /* 去色：讓彩色圖示變黑白 */
    transform: scale(0.98);    /* 微縮：視覺上產生凹陷感 */
    pointer-events: auto;      /* 確保還能點擊取消 */
}

/* 確保文字在完成時沒有刪除線 */
.row.completed .col-item, 
.row.completed .col-total,
.row.completed .box-pill {
    text-decoration: none;
}

        #fileInput { display: none; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 60px; font-size: 18px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-card">
            <div class="project-info">
                <button class="project-icon" onclick="document.getElementById('fileInput').click()">📦</button>
                <div class="project-details">
                    <h1 id="projectName">材料清單解析器</h1>
                    <p id="projectMeta">請上傳 .litematic 檔案以計算所需材料</p>
                </div>
            </div>
            <input type="text" id="searchInput" class="search-bar" placeholder="搜尋物品..." style="display:none;">
        </div>

        <input type="file" id="fileInput" accept=".litematic">

        <div class="list-card" id="listCard" style="display:none;">
            <div class="list-header">
                <div style="text-align:center; opacity: 0.5;">#</div>
                <div>Item</div>
                <div>Total</div>
                <div>Stacks (64)</div>
                <div>Shulkers</div>
            </div>
            <div id="results"></div>
        </div>
        <div id="status" class="empty-state">尚未讀取檔案</div>
    </div>

    <script type="module">
        import * as NBT from "https://cdn.jsdelivr.net/npm/nbtify@2.1.0/+esm";

        let currentData = [];
        let completedItems = new Set();

        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const statusDiv = document.getElementById('status');
            const listCard = document.getElementById('listCard');
            const searchInput = document.getElementById('searchInput');
            
            statusDiv.innerText = "正在計算方塊與載入圖示...";
            listCard.style.display = "none";
            
            try {
                const arrayBuffer = await file.arrayBuffer();
                const parsed = await NBT.read(new Uint8Array(arrayBuffer));
                const data = parsed.data; 

                // 更新標題資訊
                const metadata = data.Metadata || {};
                document.getElementById('projectName').innerText = metadata.Name || file.name.replace('.litematic', '');
                if (metadata.EnclosingSize) {
                    const s = metadata.EnclosingSize;
                    document.getElementById('projectMeta').innerText = `尺寸: ${s.x} × ${s.y} × ${s.z}`;
                }

                const itemCounts = calculateBlockCounts(data);
                
                currentData = Object.entries(itemCounts)
                    .map(([name, count]) => ({ name, count }))
                    .sort((a, b) => b.count - a.count);

                statusDiv.style.display = "none";
                listCard.style.display = "block";
                searchInput.style.display = "block";
                
                renderList(currentData);

            } catch (err) {
                console.error(err);
                statusDiv.innerText = "解析失敗：" + err.message;
            }
        });

        // 搜尋功能
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = currentData.filter(item => 
                item.name.replace(/_/g, ' ').toLowerCase().includes(term)
            );
            renderList(filtered);
        });

        // 解析 Litematica 方塊數量
        function calculateBlockCounts(data) {
            let counts = {};
            if (!data.Regions) return counts;

            for (const regionName in data.Regions) {
                const region = data.Regions[regionName];
                const palette = region.BlockStatePalette;
                const blockStates = region.BlockStates;
                const size = region.Size;

                if (!palette || !size) continue;
                
                const volume = Math.abs(size.x * size.y * size.z);
                let localCounts = new Array(palette.length).fill(0);

                if (!blockStates || blockStates.length === 0) {
                    localCounts[0] = volume;
                } else {
                    const bitsPerBlock = Math.max(4, Math.ceil(Math.log2(palette.length)));
                    const blocksPerLong = Math.floor(64 / bitsPerBlock);
                    const mask = (1n << BigInt(bitsPerBlock)) - 1n;
                    
                    let blockIndex = 0;
                    for (let i = 0; i < blockStates.length; i++) {
                        let longVal = BigInt(blockStates[i]);
                        for (let j = 0; j < blocksPerLong; j++) {
                            if (blockIndex >= volume) break;
                            let paletteIndex = Number((longVal >> BigInt(j * bitsPerBlock)) & mask);
                            if (paletteIndex >= 0 && paletteIndex < palette.length) {
                                localCounts[paletteIndex]++;
                            }
                            blockIndex++;
                        }
                    }
                }

                for (let i = 0; i < palette.length; i++) {
                    const blockName = palette[i].Name.replace('minecraft:', '');
                    if (blockName.includes('air')) continue; 
                    counts[blockName] = (counts[blockName] || 0) + localCounts[i];
                }
            }
            return counts;
        }

        // 渲染列表
// 修改：渲染列表函式
function renderList(dataArray) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '';

    dataArray.forEach(item => {
        const row = document.createElement('div');
        
        // 檢查此物品是否在已完成清單中，如果是則加上 completed 類別
        const isCompleted = completedItems.has(item.name);
        row.className = `row ${isCompleted ? 'completed' : ''}`;
        
        const blockIconUrl = `https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.19.2/blocks/${item.name}.png`;
        const itemIconUrl = `https://raw.githubusercontent.com/PrismarineJS/minecraft-assets/master/data/1.19.2/items/${item.name}.png`;

        row.innerHTML = `
            <button class="eye-btn" data-name="${item.name}" title="標記完成">
                ${isCompleted ? '✔️' : '👁️'}
            </button>
            <div class="col-item">
                <img src="${blockIconUrl}" class="block-icon" 
                     onerror="this.onerror=null; this.src='${itemIconUrl}';">
                ${formatItemName(item.name)}
            </div>
            <div class="col-total">${item.count.toLocaleString()}</div>
            <div class="col-stacks">${formatStacks(item.count)}</div>
            <div class="col-shulkers">${formatShulkers(item.count)}</div>
        `;
        resultsDiv.appendChild(row);
    });
}

// 修改：事件委託處理點擊
document.getElementById('results').addEventListener('click', function(e) {
    const btn = e.target.closest('.eye-btn');
    if (!btn) return;
    
    const row = btn.closest('.row');
    const itemName = btn.getAttribute('data-name');
    
    // 切換狀態
    if (row.classList.contains('completed')) {
        // 取消完成
        row.classList.remove('completed');
        btn.innerText = '👁️';
        completedItems.delete(itemName); // 從記錄中移除
    } else {
        // 標記完成
        row.classList.add('completed');
        btn.innerText = '✔️';
        completedItems.add(itemName);    // 加入記錄
    }
});

        function formatItemName(name) {
            return name.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function formatStacks(count) {
            const stacks = Math.floor(count / 64);
            const remainder = count % 64;
            if (stacks === 0) return `${remainder}`;
            return `<span class="highlight">${stacks}</span> <span class="dim">stacks</span> ${remainder > 0 ? `<span class="dim">+ ${remainder}</span>` : ''}`;
        }

        function formatShulkers(count) {
            const boxes = Math.floor(count / 1728); // 64 * 27
            const remainder = count % 1728;
            const stacks = Math.floor(remainder / 64);
            const extra = remainder % 64;
            
            if (boxes === 0) return '-';
            
            let html = `<span class="box-pill">${boxes} Box${boxes > 1 ? 'es' : ''}</span>`;
            if (stacks > 0 || extra > 0) {
                html += ` <span class="dim">+</span> <span class="highlight">${stacks}</span> <span class="dim">stk</span>`;
                if (extra > 0) html += ` <span class="dim">+ ${extra}</span>`;
            }
            return html;
        }
    </script>
</body>
</html>
